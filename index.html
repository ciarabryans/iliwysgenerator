    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Default theme loaded initially -->
    <link id="themeStylesheet" rel="stylesheet" href="css/iliwys-default.css">
    
    <meta name="description" content="Create your own memes inspired by 'I like it when you sleep, for you are so beautiful yet so unaware' by The 1975.">
    <meta name="keywords" content="The 1975, Matty Healy, Adam Hann, Ross MacDonald, George Daniel, meme generator, memes, I like it when you sleep">
    <meta name="author" content="Ciara Bryans">    
    <title>I Like It When You Sleep, for You Are So Beautiful yet So Unaware of It - The 1975 Meme Generator</title>
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
</head>
<body>
    <!-- Theme buttons for switching stylesheets -->
    <div class="theme-buttons">
        <div id="default-theme" class="color-circle" style="background-color: #EE9EB5;" aria-label="I Like It When You Sleep theme"></div>
        <div id="selftitled-theme" class="color-circle" style="background-color: #000;" aria-label="The 1975 self-titled theme"></div>
    </div>

    <div class="container">
        <!-- Self-titled container with pulsing glow, hidden by default -->
        <div class="self-titled-container" id="selfTitledContainer" style="display: none;">
            <div id="outputTextSelfTitled">Go down<br>Soft sound<br>Midnight<br>Car lights</div>
        </div>
        
        <div class="toggle-box" id="toggleBoxContainer">
            <span class="toggle-label">EP</span>
            <label class="switch">
                <input type="checkbox" id="toggleBox" checked>
                <span class="slider round"></span>
            </label>
            <span class="toggle-label">Box</span>
        </div>
        
        <!-- Default output text container, visible by default -->
        <div class="output-container" id="defaultOutputContainer">
            <div id="outputText"></div>
        </div>

        <textarea id="userInput" placeholder="Start typing something obnoxious..." aria-label="Text input"></textarea>
        <div class="screenshot-text">Screenshot to save</div>
    </div>
    <div class="disclaimer">
        Made with &#9829; by <a href="https://x.com/normally_inbed" target="_blank">@normally_inbed</a>, for some meme fun during The 1975's hiatus because we're missing <i>the guys</i>. <br> Not affiliated with The 1975 or Dirty Hit. (Matty don't sue me)
    </div>       
    <script src="scripts.js"></script>
</body>
